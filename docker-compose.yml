services:
    postgres:
        container_name: amrod-postgres
        image: postgres:latest
        platform: linux/arm64
        hostname: localhost
        ports:
            - "5432:5432"
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: amrod_db
        volumes:
            - postgres-data:/var/lib/postgresql
        restart: unless-stopped

    adminer:
        container_name: amrod-adminer
        image: adminer:5.4.2
        platform: linux/arm64
        ports:
            - "8081:8080"
        environment:
            ADMINER_DEFAULT_SERVER: localhost
        depends_on:
            - postgres
        restart: unless-stopped

volumes:
    postgres-data:
